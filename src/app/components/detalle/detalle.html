<main class="article" *ngIf="noticia">
  <a routerLink="/listado" class="btn btn-secondary" style="margin-bottom:24px;display:inline-block;">&lsaquo; Volver</a>

  <img [src]="noticia.imagen" [alt]="'Imagen de la noticia: ' + noticia.titulo" />
  <h1>{{ noticia.titulo }}</h1>
  <p class="meta">{{ etiqueta(noticia.categoria) }} &middot; {{ fecha(noticia.fecha) }}</p>
  <p class="contenido">{{ noticia.contenido }}</p>

  <div class="article-actions">
    <button
      type="button"
      class="btn btn-primary btn-favorito"
      [class.es-favorito]="esFav"
      (click)="manejarClickFavorito()"
    >
      {{ esFav ? 'Quitar de favoritos' : 'Agregar a favoritos' }}
    </button>
    <a [routerLink]="['/contacto']" [queryParams]="{ asunto: asuntoContacto() }" class="btn btn-secondary">
      Contactar
    </a>
  </div>
</main>

<div *ngIf="!noticia" class="article">
  <p>Esta noticia ya no esta disponible (pudo haber sido eliminada).</p>
  <a routerLink="/listado" class="btn btn-secondary">Volver al listado</a>
</div>
