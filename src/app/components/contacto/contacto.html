<div class="form-wrap">
  <div class="contact-form">
    <h1>Contactanos</h1>
    <p>Completa el formulario y te responderemos pronto.</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-field" [class.invalid]="nombreInvalido">
        <label for="input-nombre">Nombre *</label>
        <input
          type="text"
          id="input-nombre"
          name="nombre"
          [(ngModel)]="nombre"
          (ngModelChange)="onInputChange()"
          maxlength="100"
        />
        <span class="error-msg">Por favor ingresa tu nombre.</span>
      </div>

      <div class="form-field" [class.invalid]="correoInvalido">
        <label for="input-correo">Correo *</label>
        <input
          type="email"
          id="input-correo"
          name="correo"
          [(ngModel)]="correo"
          (ngModelChange)="onInputChange()"
          maxlength="150"
        />
        <span class="error-msg">Por favor ingresa un correo valido (ej. nombre&#64;correo.com).</span>
      </div>

      <div class="form-field">
        <label for="input-asunto">Asunto</label>
        <input type="text" id="input-asunto" name="asunto" [(ngModel)]="asunto" maxlength="150" />
      </div>

      <div class="form-field" [class.invalid]="mensajeInvalido">
        <label for="input-mensaje">Mensaje *</label>
        <textarea
          id="input-mensaje"
          name="mensaje"
          [(ngModel)]="mensaje"
          (ngModelChange)="onInputChange()"
          maxlength="1000"
        ></textarea>
        <span class="error-msg">Por favor escribe tu mensaje.</span>
      </div>

      <p class="required-note">* Campos obligatorios</p>

      <button type="submit" class="submit-btn">Enviar mensaje</button>

      <p class="confirm-msg" [class.visible]="mensajeEnviado" role="status">
        Mensaje enviado correctamente. Te responderemos pronto.
      </p>
    </form>
  </div>
</div>
